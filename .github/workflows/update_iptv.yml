name: Otomatik IPTV Guncelleme

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri Yukle
        run: |
          pip install requests urllib3

      - name: IPTV Botunu Calistir
        run: |
          python iptv_bot.py

      - name: Guncel Listeyi Kaydet ve Push Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add guncel_kaliteli_liste.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik IPTV Liste Guncellemesi [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)
